[package]
name = "wist-auth"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Reusable bearer-token authentication + minimal role scopes + failure rate limiting (extracted from wist-center / wist-ingest-ctrl)"

[features]
default = []
serde = ["dep:serde"]
axum = ["dep:axum", "dep:serde_json"]

[dependencies]
axum = { version = "0.8", optional = true }
http = "1"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = "0.10"

[dev-dependencies]
toml = "0.8"
